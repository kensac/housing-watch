e=\"padding-left: 20px;\"><span style=\"font-size: 12pt; font-family: Lato, sans-serif;\">Rents and Household Earning Limits advertised are based on current 2024 HUD AMI limits and may be adjusted at the time that new annual guidelines are published by HUD.</span></p>\n<p style=\"padding-left: 20px;\"><br><br><span style=\"font-size: 12pt; font-family: Lato, sans-serif;\">Don\u2019t qualify for StuyTown Affordable Housing? Want to see what else StuyTown has to offer?</span></p>\n<p style=\"padding-left: 20px;\"><br><br><span style=\"font-size: 12pt; font-family: Lato, sans-serif;\">Check out<span style=\"color: rgb(70, 143, 214);\"> <a style=\"color: rgb(70, 143, 214);\" href=\"https://www.stuytown.com/\">StuyTown.com</a></span> for other available apartments. For additional information, check out our FAQs page <span style=\"color: rgb(70, 143, 214);\"><a style=\"color: rgb(70, 143, 214);\" href=\"#\" title=\"FAQs\">here</a>.</span></span><br><br><br></p>\n<p style=\"padding-left: 20px;\">&nbsp;</p>"}]}
