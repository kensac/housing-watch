name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      HW_TEST_DATABASE_URL: postgresql+psycopg://postgres:pg@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - run: uv sync --frozen
      - run: uv run ruff check src tests alembic
      - run: uv run ruff format --check src tests alembic
      - name: schema.graphql matches the schema in code
        run: uv run python -m housing_watch schema --check schema.graphql
      # Offline: adapter tests parse saved fixtures; store/fleet/web tests use the postgres service.
      - run: uv run python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated types are current and every document validates against schema.graphql
        run: |
          npm run codegen
          git status --porcelain -- src/gql
          test -z "$(git status --porcelain -- src/gql)" || { echo "src/gql is stale: run npm run codegen and commit it"; exit 1; }
      - run: npm run lint
      - run: npm run build # tsc -b (typecheck) + vite build
