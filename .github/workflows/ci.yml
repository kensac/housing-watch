name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      HW_TEST_DATABASE_URL: postgresql+psycopg://postgres:pg@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - run: uv sync --frozen
      - run: uv run ruff check src tests alembic
      - run: uv run ruff format --check src tests alembic
      # Offline: adapter tests parse saved fixtures; store/fleet/web tests use the postgres service.
      - run: uv run python -m pytest -q
