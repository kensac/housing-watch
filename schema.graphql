"""A listing, summarized and judged for the profile."""
type Listing {
  key: String!
  source: String!
  title: String!
  url: String!
  address: String
  borough: String

  """As published, or "gone" once the source stopped listing it"""
  status: Status!
  kind: String!
  deadline: String
  senior_only: Boolean!
  first_seen: DateTime!
  last_changed: DateTime!
  gone_since: DateTime
  verdict: Verdict!
  reason: String!
  units: Int!
  eligible_units: Int!
  sizes: [String!]!
  rent_min: Float
  rent_max: Float
  ami_min: Int
  ami_max: Int

  """Transit minutes to HW_COMMUTE_TO (eligible listings only)"""
  commute: Int
  commute_route: CommuteRoute

  """The stage of this listing's tracker row (tracker.stage of its Status)"""
  application: String

  """Whose move that stage is; None for an unknown status"""
  application_group: StageGroup

  """When the row entered that stage, as first recorded"""
  application_since: DateTime

  """The stage predates tracking: it began before application_since"""
