  """The cell's hyperlink, if it has one"""
  link: String
}

type TrackerLinkPayload {
  listing_key: String!
  row_key: String

  """The listing as it reads after the change."""
  listing: Listing
}

"""How a listing was matched to its tracker row."""
enum TrackerMatch {
  url
  address
  name
  manual
}

"""
A tracker sheet row with its stage history and the listings matched to it.
"""
type TrackerRow {
  row_key: String!

  """The sheet row number"""
  position: Int!
  property: String!

  """As written in the sheet"""
  status: String

  """The stage that status means (tracker.stage)"""
  stage: String

  """Whose move that stage is"""
  group: StageGroup

  """When the row entered its stage"""
  stage_since: DateTime

  """The stage predates tracking: it began before stage_since"""
  stage_since_baseline: Boolean!

  """Stage changes, oldest first"""
  events: [StageStep!]!
  notes: String
  source_url: String
  page_url: String

  """Every column of the row, as the sheet has them"""
  cells: [TrackerCell!]!

  """Empty: unmatched, link one by hand"""
  listings: [Listing!]!
}

