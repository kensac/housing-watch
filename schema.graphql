"""The profile and the registries the app builds its pages from."""
type Meta {
  profile: Profile!
  statuses: [Status!]!
  verdicts: [Verdict!]!
  ops: [OpLabel!]!
  pages: Pages!
}

type Mutation {
  """Save a view of a page."""
  createView(input: CreateViewInput!): ViewPayload!

  """
  Rename, replace the state, set or clear the default, or move it one place.
  """
  changeView(input: ChangeViewInput!): ViewPayload!

  """A copy of a view, named "<name> (copy)"."""
  duplicateView(input: ViewIdInput!): ViewPayload!
  deleteView(input: ViewIdInput!): DeleteViewPayload!

  """Link a listing to a sheet row, or mark it as in no row (row_key null)."""
  linkTracker(input: LinkTrackerInput!): TrackerLinkPayload!

  """Drop a manual link: the listing goes back to automatic matching."""
  unlinkTracker(input: UnlinkTrackerInput!): TrackerLinkPayload!
}

type OpLabel {
  op: FilterOp!
  label: String!
}

type Overview {
  eligible_open: Int!

  """Eligible and open, waitlist or upcoming"""
  eligible_live: Int!
  new_24h: Int!
  new_7d: Int!
  baseline_24h: Int!
  changed_24h: Int!
  changed_7d: Int!
  failing: [String!]!
  last_digest: DateTime
  pending: Int!
  eligible_now: [Listing!]!
  recent: [Event!]!
  total: Int!
  n_sources: Int!
  matrix: [MatrixCell!]!
  digest: Digest
}

"""A list page of the app."""
enum Page {
  listings
  units
  events
}

"""What changed on a watched page (`page_changed`)."""
type PageChange {
  """New lines of text"""
  added: [String!]!
  removed: [String!]!
  new_links: [String!]!
}

type PageInfo {
  has_next_page: Boolean!
  has_previous_page: Boolean!
  start_cursor: String
  end_cursor: String
}

type PageMeta {
  fields: [FilterField!]!
  columns: [Choice!]!
  default_columns: [String!]!
  default_sort: String!
  sorts: [Choice!]!
}

type Pages {
  listings: PageMeta!
  units: PageMeta!
  events: PageMeta!
}

type Profile {
  household: Int!

  """Annual household income; required to run"""
  income: Int!
  max_rent: Float
  sizes: [String!]!
  excluded_boroughs: [String!]!
}

type Query {
  """The profile and the registries the app builds its pages from."""
  meta: Meta!

  """
  Listings matching the filters and search, one per building or opportunity. Filters (`f`) are `field.op.values` strings; `meta.pages` lists the fields and operators.
  """
  listings(f: [String!] = null, q: String! = "", sort: String! = "", first: Int! = 200, after: String = null): ListingConnection!

  """
  Every unit or rent tier of the matching listings; unit filters hold on its own unit. Filters (`f`) are `field.op.values` strings; `meta.pages` lists the fields and operators.
  """
  units(f: [String!] = null, q: String! = "", sort: String! = "", first: Int! = 200, after: String = null): UnitConnection!

  """One listing with every unit, its notes and its history."""
  listing(key: String!): ListingDetail!

  """
  Each linked application PDF, fetched to see whether it is a form we can fill.
  """
  listingApplications(key: String!): Applications!

  """
  Distinct values of a field with counts under the other filters (send them without the one being
  edited); `enum` says whether the field has few enough values to pick from.
  """
  values(page: Page!, field: String!, f: [String!] = null, q: String! = ""): Values!

  """
  What happened, newest first. Listing filters apply through the event's listing.
  """
  events(f: [String!] = null, first: Int! = 200, after: String = null): EventConnection!

  """
  Counts by verdict and status, eligible listings open now, recent events and failing sources.
  """
  overview: Overview!

  """Every source with its health, schedule and listing counts."""
  sources: [Source!]!

  """
  Procrastinate's workers, queues and failed jobs, and the hosts that ran sources.
  """
  fleet: Fleet!

  """
  Every tracker sheet row with its stage history and the listings matched to it.
  """
  tracker: Tracker!

  """Every saved view with its current match count."""
  views: [View!]!
}

type QueueCount {
  queue: String!
  status: String!
  count: Int!
}

type Source {
  source: String!
  title: String
  url: String
  every_hours: Float

  """Ok, failing, or never (no run has succeeded yet)"""
  health: Health!
  last_ok: DateTime
  last_attempt: DateTime
  failing_since: DateTime
  consecutive_failures: Int!
  next_due: DateTime

  """Seconds"""
  last_duration: Float
  last_error: String
  last_events: Int

  """Listed now (not gone)"""
  listings: Int!
  eligible: Int!
  possible: Int!

  """Who ran it in the last 7 days"""
  workers: [String!]!
}

"""A `source_failed` event."""
type SourceFailure {
  error: String

  """Consecutive failures when it was recorded"""
  fails: Int
}

"""Whose move an application stage is."""
enum StageGroup {
  your_move
  their_move
  done
}

"""
A row entering a stage. `baseline`: it was already there when tracking began, so it entered earlier.
"""
type StageStep {
  at: DateTime!
  stage_from: String
  stage_to: String

  """Already in this stage when tracking began"""
  baseline: Boolean!
  group: StageGroup
}

"""A listing's status as published; gone once its source dropped it."""
enum Status {
  open
  waitlist
  upcoming
  unknown
  closed
  gone
}

type Tracker {
  """HW_TRACKER_SHEET is set"""
  configured: Boolean!
  synced: DateTime

  """By stage, then longest in it"""
  rows: [TrackerRow!]!
}

"""One column of a sheet row."""
type TrackerCell {
  """The column header"""
  name: String!
