[project]
name = "housing-watch"
version = "0"
description = "Deterministic watcher for NYC affordable-housing listings"
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "sqlalchemy==2.1.5",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "procrastinate==3.10.0",
    "fastapi==0.150.0",
    "uvicorn==0.54.0",
    "prometheus-client==0.26.0",
    "pypdf==6.21.1",
    "reportlab==5.0.1",
    "google-auth[requests]==2.62.0",
    "playwright==1.64.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
