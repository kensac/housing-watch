[project]
name = "housing-watch"
version = "0"
description = "Deterministic watcher for NYC affordable-housing listings"
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "beautifulsoup4==4.13.4",
    "lxml==6.0.2",
    "sqlalchemy==2.0.43",
    "alembic==1.16.5",
    "psycopg[binary]==3.2.10",
    "procrastinate==3.10.0",
    "fastapi==0.146.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "prometheus-client==0.26.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.12.7",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
