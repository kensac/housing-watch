<div class="toolbar" data-results="#{{ 'results' if page == 'listings' else 'ev-results' }}">
  {% if page == "listings" %}<input type="search" id="f-q" value="{{ st.q }}" placeholder="Search title, address, notes…" autocomplete="off" aria-label="Search">{% endif %}
  <div class="pop-anchor">
    <button type="button" class="btn" data-builder="{{ page }}"><span class="plus">+</span> Filter</button>
    <div id="builder" class="popover" hidden></div>
  </div>
  {% include "_chips.html" %}
  <div class="toolbar-end">
    <div class="pop-anchor">
      <button type="button" class="btn ghost" data-pop="cols-pop">Columns</button>
      <div id="cols-pop" class="popover right" hidden>
        <div class="pop-title">Columns</div>
        {% for k, label in COLUMNS[page].items() %}<label class="fb-check"><input type="checkbox" name="col" value="{{ k }}" {{ 'checked' if k in st.columns }}><span>{{ label }}</span></label>{% endfor %}
      </div>
    </div>
    {% include "_viewbar.html" %}
  </div>
</div>
