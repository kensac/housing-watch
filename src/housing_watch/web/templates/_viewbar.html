<div id="viewbar" class="viewbar"{% if hx %} hx-swap-oob="true"{% endif %}>
{% if view %}
  <span class="vb-name" title="Saved view">{% if modified %}<i class="mod-dot" title="Changed since it was saved"></i>{% endif %}{{ view.name }}</span>
  {% if modified %}<button type="button" class="btn sm primary" hx-patch="/views/{{ view.id }}" hx-vals='{"save": "1"}'>Save changes</button>{% endif %}
  <button type="button" class="btn sm" data-save-open>Save as new…</button>
  <details class="menu">
    <summary class="btn sm ghost" aria-label="View actions">•••</summary>
    <div class="menu-list">
      <button type="button" data-rename="{{ view.id }}" data-name="{{ view.name }}">Rename…</button>
      <button type="button" hx-post="/views/{{ view.id }}/duplicate">Duplicate</button>
      <button type="button" hx-patch="/views/{{ view.id }}" hx-vals='{"default": "{{ 0 if view.is_default else 1 }}"}'>{{ "Stop opening by default" if view.is_default else "Open by default" }}</button>
      <button type="button" hx-patch="/views/{{ view.id }}" hx-vals='{"move": "-1"}'>Move up</button>
      <button type="button" hx-patch="/views/{{ view.id }}" hx-vals='{"move": "1"}'>Move down</button>
      <button type="button" class="danger" hx-delete="/views/{{ view.id }}" hx-confirm="Delete the view “{{ view.name }}”? Its filters stay in the URL.">Delete</button>
    </div>
  </details>
{% else %}
  <button type="button" class="btn sm" data-save-open>Save view…</button>
{% endif %}
</div>
